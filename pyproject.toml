[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chengxin"
version = "0.1.0"
description = "餐盘照片估热量：模型只说有什么、多少克，热量由本地营养表乘出来"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
chengxin = "chengxin.cli:main"

[tool.setuptools]
packages = ["chengxin"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
